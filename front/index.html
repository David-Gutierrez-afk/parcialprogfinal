<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Gestión de Incapacidades Médicas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page">
    <main class="login-card">
        <header class="login-brand">
            <span class="login-brand-tag">Corporate Solutions</span>
            <h1>Gestión de Incapacidades</h1>
            <p>Ingrese sus credenciales para acceder a la plataforma administrativa.</p>
        </header>

        <div id="loginAlert" class="alert is-hidden" role="alert"></div>

        <form id="loginForm" name="loginForm" novalidate>
            <div class="form-group">
                <label for="identificador">Usuario o correo electrónico</label>
                <input
                    type="text"
                    id="identificador"
                    name="identificador"
                    autocomplete="username"
                    placeholder="Ej. admin o admin@empresa.com"
                    required
                >
            </div>

            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input
                    type="password"
                    id="contrasena"
                    name="contrasena"
                    autocomplete="current-password"
                    placeholder="Ingrese su contraseña"
                    required
                >
            </div>

            <button type="submit" id="loginSubmitButton" class="button button-primary button-block">
                Iniciar sesión
            </button>
        </form>

        <footer class="login-help">
            <p><strong>Usuarios de prueba:</strong></p>
            <p>Administrador: <strong>admin</strong> / <strong>admin123</strong></p>
            <p>Gestión Humana: <strong>gestionhumana</strong> / <strong>gh123</strong></p>
        </footer>
    </main>

    <script type="module" src="js/login.js"></script>
</body>
</html>
